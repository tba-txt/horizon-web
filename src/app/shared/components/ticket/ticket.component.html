    <div class="separator">
      <span class="span-lines"></span>
    </div>
    <div class="content-ticket">
      <div class="content-data">
        <div class="destination">
          <div class="dest start">
            <p class="country">Origem</p>
            <p class="acronym">{{ origin | uppercase }}</p>
            <p class="hour">
              {{ departureTime }}
            </p>
          </div>
          <div class="route-plane-badge">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              height="16"
              viewBox="0 0 24 24"
            >
              <path
                fill="#5BA4D8"
                d="M20.56 3.91c.59.59.59 1.54 0 2.12l-3.89 3.89l2.12 9.19l-1.41 1.42l-3.88-7.43L9.6 17l.36 2.47l-1.07 1.06l-1.76-3.18l-3.19-1.77L5 14.5l2.5.37L11.37 11L3.94 7.09l1.42-1.41l9.19 2.12l3.89-3.89c.56-.58 1.56-.58 2.12 0"
              ></path>
            </svg>
          </div>
          <div class="dest end text-end">
            <p class="country">Destino</p>
            <p class="acronym">{{ destination | uppercase }}</p>
            <p class="hour justify-content-end">
              {{ arrivalTime }}
            </p>
          </div>
        </div>
        <div style="height: 2px;"></div>
        <div class="data-flex-col">
          <div class="data-flex">
            <div class="data">
              <p class="title">Nº BILHETE</p>
              <p class="subtitle subtitle-blue">{{ ticketNumber }}</p>
            </div>
            <div class="data passenger text-end">
              <p class="title">PASSAGEIRO</p>
              <p class="subtitle">{{ passengerName }}</p>
            </div>
          </div>
          <div class="data-flex">
            <div class="data">
              <p class="title">VOO</p>
              <p class="subtitle">{{ flightNumber }}</p>
            </div>
            <div class="data text-end">
              <p class="title">PORTÃO</p>
              <p class="subtitle subtitle-blue">{{ gate }}</p>
            </div>
          </div>
        </div>
      </div>
      <div class="container-icons">
        <div class="icon plane">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
          >
            <path
              fill="currentColor"
              d="M20.56 3.91c.59.59.59 1.54 0 2.12l-3.89 3.89l2.12 9.19l-1.41 1.42l-3.88-7.43L9.6 17l.36 2.47l-1.07 1.06l-1.76-3.18l-3.19-1.77L5 14.5l2.5.37L11.37 11L3.94 7.09l1.42-1.41l9.19 2.12l3.89-3.89c.56-.58 1.56-.58 2.12 0"
            ></path>

        </div>
        <div class="icon brand-mark">
          HZ
        </div>
      </div>
