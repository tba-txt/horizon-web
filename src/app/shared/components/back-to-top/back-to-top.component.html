@if (showBackToTop()) {
      <button 
        type="button" 
        class="btn-back-to-top shadow-lg"
        (click)="scrollToTop()"
        aria-label="Voltar para o topo da página"
        title="Voltar ao topo"
      >
        <i class="bi bi-arrow-up-circle-fill fs-5"></i>
        <span>Voltar ao topo</span>
      </button>
    }
