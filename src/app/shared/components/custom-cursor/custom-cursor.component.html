@if (isEnabled()) {
  <div 
    #cursorContainer 
    class="horizon-figma-cursor is-hidden" 
    aria-hidden="true"
  >
    <!-- Figma Multiplayer Arrow Cursor -->
    <svg 
      class="cursor-arrow" 
      width="22" 
      height="22" 
      viewBox="0 0 24 24" 
      fill="none" 
      xmlns="http://www.w3.org/2000/svg"
    >
      <path 
        d="M0.5 0.5L0.5 18.5C0.5 19.1 1.2 19.4 1.6 19.0L6.7 13.9C6.9 13.7 7.2 13.6 7.5 13.6H14.7C15.3 13.6 15.6 12.9 15.2 12.5L1.4 0.3C1.0 -0.1 0.5 0.1 0.5 0.5Z" 
        fill="#5BA4D8" 
        stroke="#ffffff" 
        stroke-width="1.6" 
        stroke-linejoin="round"
      />
    </svg>

    <!-- Figma Name Tag / Badge -->
    <div class="cursor-tag">
      <span class="cursor-name">{{ displayName() }}</span>
    </div>
  </div>
}
